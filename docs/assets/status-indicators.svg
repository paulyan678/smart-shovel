<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="indicator-title indicator-desc">
  <title id="indicator-title">Smart Shovel external D2 status indicator definitions</title>
  <desc id="indicator-desc">Seven firmware status modes are documented as active-high LED waveforms. Boot is selected during setup and six operational modes are serviced in the main loop. One external D2 LED communicates state through pulse count and timing, with every pattern also described in text.</desc>
  <defs>
    <style>
      .bg{fill:#f7faf8}.text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.ink{fill:#17313c}.muted{fill:#5b717a}.title{font-size:34px;font-weight:780}.subtitle{font-size:17px}.head{font-size:18px;font-weight:750}.body{font-size:14px}.small{font-size:12px}.label{font-size:11px;font-weight:760;letter-spacing:.7px}.panel{fill:#fff;stroke:#c2d0cd;stroke-width:2}.row{fill:#fff;stroke:#d5e0dd;stroke-width:1.5}.ready-row{fill:#e8f5ef;stroke:#24755d;stroke-width:1.8}.warn-row{fill:#fff8e7;stroke:#c08a3f;stroke-width:1.8}.fault-row{fill:#fff0ef;stroke:#b84a45;stroke-width:1.8}.wave{fill:none;stroke:#176f56;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}.wave-warn{fill:none;stroke:#9a5b0d;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}.wave-fault{fill:none;stroke:#a63f3b;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}.axis{stroke:#91a5aa;stroke-width:1.5}.cycle{fill:#eef3f2;stroke:#cbd8d5;stroke-width:1.2}.cycle-text{font-size:11px;font-weight:700;fill:#415d68}
    </style>
  </defs>
  <rect width="1440" height="920" class="bg"/>
  <g class="text">
    <text x="48" y="58" class="title ink">Status definitions: one external D2 LED</text>
    <text x="48" y="88" class="subtitle muted">Waveform high = LED on · active-high default · six operational modes are loop-serviced</text>

    <rect x="48" y="112" width="836" height="78" rx="18" class="panel"/>
    <text x="70" y="143" class="label" fill="#176f56">ELECTRICAL INTERFACE</text>
    <text x="70" y="173" class="head ink">D2 anode → current-limit resistor · cathode → GND · active high</text>

    <rect x="908" y="112" width="484" height="78" rx="18" class="panel"/>
    <text x="930" y="143" class="label" fill="#176f56">ACCESSIBLE STATUS DESIGN</text>
    <text x="930" y="173" class="head ink">Pulse count + timing encode every state</text>

    <!-- shared waveform guides -->
    <text x="750" y="216" class="label muted">PATTERN PREVIEW — ONE DOCUMENTED CYCLE OR 1 SECOND OF A REPEATING BLINK</text>
    <line x1="750" y1="230" x2="1300" y2="230" class="axis"/>
    <text x="750" y="225" class="small muted">0</text>
    <text x="1300" y="225" text-anchor="end" class="small muted">cycle end</text>

    <!-- Booting -->
    <rect x="48" y="240" width="1344" height="76" rx="16" class="row"/>
    <text x="72" y="270" class="head ink">Booting</text>
    <text x="72" y="294" class="small muted">2 × 100 ms on/off + 600 ms pause</text>
    <text x="400" y="274" class="body ink">Selected during setup</text>
    <text x="400" y="294" class="small muted">Defined double-pulse signature</text>
    <line x1="750" y1="288" x2="1300" y2="288" class="axis"/>
    <path d="M750 288 V252 H805 V288 H860 V252 H915 V288 H1300" class="wave"/>
    <rect x="1308" y="259" width="64" height="26" rx="13" class="cycle"/><text x="1340" y="277" text-anchor="middle" class="cycle-text">1000 ms</text>

    <!-- Calibrating -->
    <rect x="48" y="328" width="1344" height="76" rx="16" class="row"/>
    <text x="72" y="358" class="head ink">Calibrating</text>
    <text x="72" y="382" class="small muted">500 ms on + 500 ms off, repeating</text>
    <text x="348" y="370" class="body ink">Waiting for stable empty startup tare</text>
    <line x1="750" y1="376" x2="1300" y2="376" class="axis"/>
    <path d="M750 376 V340 H1025 V376 H1300" class="wave"/>
    <rect x="1308" y="347" width="64" height="26" rx="13" class="cycle"/><text x="1340" y="365" text-anchor="middle" class="cycle-text">1000 ms</text>

    <!-- Ready -->
    <rect x="48" y="416" width="1344" height="76" rx="16" class="ready-row"/>
    <text x="72" y="446" class="head ink">Ready</text>
    <text x="72" y="470" class="small muted">Solid on while no higher-priority condition applies</text>
    <text x="348" y="458" class="body ink">Default steady-state indication</text>
    <line x1="750" y1="464" x2="1300" y2="464" class="axis"/>
    <path d="M750 464 V428 H1300" class="wave"/>
    <rect x="1308" y="435" width="64" height="26" rx="13" class="cycle"/><text x="1340" y="453" text-anchor="middle" class="cycle-text">SOLID</text>

    <!-- Waiting GPS -->
    <rect x="48" y="504" width="1344" height="76" rx="16" class="row"/>
    <text x="72" y="534" class="head ink">Waiting for GNSS</text>
    <text x="72" y="558" class="small muted">125 ms on + 125 ms off, repeating</text>
    <text x="348" y="546" class="body ink">A queued event is inside its bounded 5 s wait</text>
    <line x1="750" y1="552" x2="1300" y2="552" class="axis"/>
    <path d="M750 552 V516 H819 V552 H888 V516 H956 V552 H1025 V516 H1094 V552 H1163 V516 H1231 V552 H1300" class="wave"/>
    <rect x="1308" y="523" width="64" height="26" rx="13" class="cycle"/><text x="1340" y="541" text-anchor="middle" class="cycle-text">1000 ms</text>

    <!-- GPS degraded -->
    <rect x="48" y="592" width="1344" height="76" rx="16" class="warn-row"/>
    <text x="72" y="622" class="head ink">GNSS degraded</text>
    <text x="72" y="646" class="small muted">150 ms on + 150 ms off, then 1200 ms pause</text>
    <text x="348" y="634" class="body ink">UART silent or current full fix not valid</text>
    <line x1="750" y1="640" x2="1300" y2="640" class="axis"/>
    <path d="M750 640 V604 H805 V640 H1300" class="wave-warn"/>
    <rect x="1308" y="611" width="64" height="26" rx="13" class="cycle"/><text x="1340" y="629" text-anchor="middle" class="cycle-text">1500 ms</text>

    <!-- Storage degraded -->
    <rect x="48" y="680" width="1344" height="76" rx="16" class="warn-row"/>
    <text x="72" y="710" class="head ink">Storage degraded</text>
    <text x="72" y="734" class="small muted">3 × (150 ms on + 150 ms off), then 600 ms pause</text>
    <text x="348" y="722" class="body ink">SD unavailable or queue-overflow loss latched</text>
    <line x1="750" y1="728" x2="1300" y2="728" class="axis"/>
    <path d="M750 728 V692 H805 V728 H860 V692 H915 V728 H970 V692 H1025 V728 H1300" class="wave-warn"/>
    <rect x="1308" y="699" width="64" height="26" rx="13" class="cycle"/><text x="1340" y="717" text-anchor="middle" class="cycle-text">1500 ms</text>

    <!-- Sensor fault -->
    <rect x="48" y="768" width="1344" height="76" rx="16" class="fault-row"/>
    <text x="72" y="798" class="head ink">Sensor fault</text>
    <text x="72" y="822" class="small muted">5 × (100 ms on + 100 ms off), then 500 ms pause</text>
    <text x="348" y="810" class="body ink">IMU unavailable or repeated IMU / ADC failure</text>
    <line x1="750" y1="816" x2="1300" y2="816" class="axis"/>
    <path d="M750 816 V780 H787 V816 H823 V780 H860 V816 H897 V780 H933 V816 H970 V780 H1007 V816 H1043 V780 H1080 V816 H1300" class="wave-fault"/>
    <rect x="1308" y="787" width="64" height="26" rx="13" class="cycle"/><text x="1340" y="805" text-anchor="middle" class="cycle-text">1500 ms</text>

    <rect x="48" y="864" width="1344" height="36" rx="18" fill="#eef3f2" stroke="#cbd8d5"/>
    <text x="720" y="888" text-anchor="middle" class="body ink">Loop-serviced modes use global millis() phase; mode changes do not restart a waveform at phase zero.</text>
  </g>
</svg>
