<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="cycle-title cycle-desc">
  <title id="cycle-title">Smart Shovel collection cycle</title>
  <desc id="cycle-desc">The firmware establishes a stable startup tare, samples analog and IMU data every nominal 50 milliseconds, rejects invalid or moving samples, applies orientation correction and a demo mass conversion, detects one collection event, buffers it in RAM, waits up to five seconds for GNSS data, and synchronously appends one schema version two row to events.csv. Release and cooldown re-arm detection, while host validation feeds an aggregation preview.</desc>
  <defs>
    <marker id="cycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#31515f"/></marker>
    <style>
      .bg{fill:#f7faf8}.text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.ink{fill:#17313c}.muted{fill:#5b717a}.title{font-size:34px;font-weight:780}.subtitle{font-size:17px}.head{font-size:21px;font-weight:750}.body{font-size:15px}.small{font-size:13px}.label{font-size:12px;font-weight:750;letter-spacing:.7px}.panel{fill:#fff;stroke:#c2d0cd;stroke-width:2}.step{fill:#fff;stroke:#24755d;stroke-width:2.5}.warning{fill:#fff0ef;stroke:#b84a45;stroke-width:2}.current-fill{fill:#e8f5ef}.arrow{fill:none;stroke:#31515f;stroke-width:3;marker-end:url(#cycle-arrow)}.return{fill:none;stroke:#31515f;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#cycle-arrow)}.num{fill:#176f56}.num-text{fill:#fff;font-size:18px;font-weight:800}.pill-current{fill:#176f56}.pill-text{fill:#fff;font-size:12px;font-weight:750;letter-spacing:.7px}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;fill:#17313c}.branch{fill:#f0f4f3;stroke:#7f969e;stroke-width:1.5}.keyline{stroke:#dbe4e2;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1440" height="900" class="bg"/>
  <g class="text">
    <text x="48" y="58" class="title ink">From shovel motion to one event row</text>
    <text x="48" y="88" class="subtitle muted">Deterministic sensing · resilient event capture · schema-first data export</text>

    <!-- Top flow -->
    <rect x="48" y="142" width="300" height="174" rx="20" class="step"/>
    <circle cx="82" cy="174" r="20" class="num"/><text x="82" y="181" text-anchor="middle" class="num-text">1</text>
    <text x="112" y="181" class="head ink">Start empty and steady</text>
    <rect x="72" y="204" width="114" height="24" rx="12" class="pill-current"/><text x="129" y="221" text-anchor="middle" class="pill-text">STARTUP TARE</text>
    <text x="72" y="254" class="body ink">32 stable samples</text>
    <text x="72" y="278" class="small muted">≤12 mV signal span · ≤0.05 g z-span</text>
    <text x="72" y="300" class="small muted">Begin with the shovel head empty</text>

    <rect x="390" y="142" width="300" height="174" rx="20" class="step"/>
    <circle cx="424" cy="174" r="20" class="num"/><text x="424" y="181" text-anchor="middle" class="num-text">2</text>
    <text x="454" y="181" class="head ink">Acquire and qualify</text>
    <text x="414" y="220" class="body ink">Nominal 50 ms schedule</text>
    <text x="414" y="246" class="small muted">A0 average ×8 + acceleration + gyro</text>
    <text x="414" y="270" class="small muted">ADC average must be counts 64…65471</text>
    <text x="414" y="294" class="small muted">Stable: |a| = 1 g ±0.15; |gyro| ≤15°/s</text>

    <rect x="732" y="142" width="300" height="174" rx="20" class="step"/>
    <circle cx="766" cy="174" r="20" class="num"/><text x="766" y="181" text-anchor="middle" class="num-text">3</text>
    <text x="796" y="181" class="head ink">Correct and align</text>
    <rect x="756" y="204" width="174" height="24" rx="12" class="pill-current"/><text x="843" y="221" text-anchor="middle" class="pill-text">ORIENTATION MODEL</text>
    <text x="756" y="252" class="formula">Δ = (signal − tare)</text>
    <text x="756" y="275" class="formula">    − s × (az − tare_az)</text>
    <text x="756" y="300" class="small muted">Four aligned 8-sample stable filters</text>

    <rect x="1074" y="142" width="318" height="174" rx="20" class="step"/>
    <circle cx="1108" cy="174" r="20" class="num"/><text x="1108" y="181" text-anchor="middle" class="num-text">4</text>
    <text x="1138" y="181" class="head ink">Confirm one event</text>
    <text x="1098" y="222" class="body ink">5 stable filtered samples ≥150 g</text>
    <text x="1098" y="250" class="small muted">≤75 g change between detector updates</text>
    <text x="1098" y="276" class="small muted">Emit once, then latch until release</text>
    <text x="1098" y="300" class="small" fill="#176f56">Demo mass scale: −15 g/mV</text>

    <path d="M348 229 H390" class="arrow"/>
    <path d="M690 229 H732" class="arrow"/>
    <path d="M1032 229 H1074" class="arrow"/>

    <!-- Continuity branch -->
    <rect x="390" y="342" width="642" height="62" rx="16" class="branch"/>
    <text x="412" y="368" class="label ink">SAMPLE REJECTION &amp; RECOVERY</text>
    <text x="412" y="390" class="body muted">Reset startup tare if unfinished; otherwise clear all aligned filters and detector candidate continuity.</text>
    <path d="M540 316 V342" class="return"/>
    <path d="M732 373 H370 Q356 373 356 359 V268 H390" class="return"/>

    <!-- Bottom flow -->
    <rect x="1074" y="454" width="318" height="172" rx="20" class="step"/>
    <circle cx="1108" cy="486" r="20" class="num"/><text x="1108" y="493" text-anchor="middle" class="num-text">5</text>
    <text x="1138" y="493" class="head ink">Queue measurement</text>
    <text x="1098" y="532" class="body ink">Four-entry RAM FIFO</text>
    <text x="1098" y="558" class="small muted">Raw ADC + corrected signal + mass + az</text>
    <text x="1098" y="582" class="small muted">Four-slot capacity with overflow status</text>
    <text x="1098" y="606" class="small" fill="#176f56">Identity remains stable across retries</text>

    <rect x="732" y="454" width="300" height="172" rx="20" class="step"/>
    <circle cx="766" cy="486" r="20" class="num"/><text x="766" y="493" text-anchor="middle" class="num-text">6</text>
    <text x="796" y="493" class="head ink">Gather GNSS evidence</text>
    <text x="756" y="532" class="body ink">Up to 5 s; merge best components</text>
    <text x="756" y="558" class="small muted">Location · UTC · altitude · satellites</text>
    <text x="756" y="582" class="small muted">Freeze selected validity and age</text>
    <text x="756" y="606" class="small" fill="#176f56">Timeout is a separate true/false field</text>

    <rect x="390" y="454" width="300" height="172" rx="20" class="step"/>
    <circle cx="424" cy="486" r="20" class="num"/><text x="424" y="493" text-anchor="middle" class="num-text">7</text>
    <text x="454" y="493" class="head ink">Append schema-v2 row</text>
    <rect x="414" y="516" width="184" height="24" rx="12" class="pill-current"/><text x="506" y="533" text-anchor="middle" class="pill-text">DURABLE SD APPEND</text>
    <text x="414" y="567" class="body ink">FILE_WRITE | O_SYNC · close boundary</text>
    <text x="414" y="591" class="small muted">Retry-stable sequence · exact header</text>
    <text x="414" y="613" class="small muted">Dependency-confirmed durability boundary</text>

    <rect x="48" y="454" width="300" height="172" rx="20" class="step"/>
    <circle cx="82" cy="486" r="20" class="num"/><text x="82" y="493" text-anchor="middle" class="num-text">8</text>
    <text x="112" y="493" class="head ink">Validate exported CSV</text>
    <text x="72" y="534" class="body ink">tools/validate_events.py</text>
    <text x="72" y="560" class="small muted">Schema · ranges · identity · retry rows</text>
    <text x="72" y="586" class="small muted">Duplicate identity consistency checks</text>
    <text x="72" y="610" class="small" fill="#176f56">Validated rows ready for analysis</text>

    <path d="M1233 316 V454" class="arrow"/>
    <path d="M1074 540 H1032" class="arrow"/>
    <path d="M732 540 H690" class="arrow"/>
    <path d="M390 540 H348" class="arrow"/>

    <!-- Re-arm and retry -->
    <rect x="390" y="663" width="642" height="90" rx="18" class="current-fill" stroke="#24755d" stroke-width="2"/>
    <text x="412" y="691" class="label" fill="#176f56">RE-ARM THE DETECTOR</text>
    <text x="412" y="716" class="body ink">5 stable samples ≤50 g → 1 s cooldown → idle.</text>
    <text x="412" y="738" class="small muted">Cooldown expires even if a new load arrives during the interval.</text>
    <path d="M1180 626 V704 Q1180 718 1166 718 H1032" class="arrow"/>
    <path d="M390 704 H238 Q224 704 224 690 V626" class="return"/>

    <rect x="1074" y="663" width="318" height="90" rx="18" class="warning"/>
    <text x="1098" y="691" class="label" fill="#a63f3b">STORAGE DEGRADED</text>
    <text x="1098" y="716" class="body ink">Retain queued event</text>
    <text x="1098" y="738" class="small muted">SD re-init backoff: 30–300 s</text>
    <path d="M540 626 V650 Q540 662 552 662 H1074" class="return"/>
    <path d="M1074 682 H1042 Q1032 682 1032 638 H704 Q690 638 690 626" class="return"/>

    <!-- Outcome strip -->
    <rect x="48" y="784" width="1344" height="76" rx="20" class="panel"/>
    <text x="72" y="829" class="body ink">events.csv → validated event rows</text>
    <path d="M402 822 H564" class="arrow"/>
    <text x="590" y="829" class="body ink">interactive aggregation preview → location-aware project story</text>
  </g>
</svg>
